[project]
name = "earshot"
version = "0.1.0"
description = "Live AI audio-described football commentary for blind and partially sighted fans"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "pydantic>=2.9",
  "numpy>=2.0",
  "agent-framework-core>=1.21",
  "agent-framework-foundry>=1.14",
  "mcp>=1.20",
  "azure-identity>=1.19",
  "httpx>=0.27",
  "starlette>=0.40",
  "uvicorn>=0.30",
  "azure-storage-blob>=12.23",
  "azure-messaging-webpubsubservice>=1.2",
  "openai>=1.80",
]

[project.scripts]
earshot = "earshot.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "hypothesis>=6.112",
  "jsonschema>=4.23",
  "ruff>=0.7",
  "pyright>=1.1.385",
  "azure-ai-evaluation>=1.18",
]

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/earshot"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "PT"]
ignore = ["RUF001", "RUF002", "RUF003", "SIM905"]  # Arabic/Devanagari text is intentional; word lists read best as strings

[tool.ruff.lint.per-file-ignores]
"src/**" = ["PT018"]  # asserts in src narrow types for invariants; PT rules target tests
"src/earshot/agents/analyst.py" = ["E501"]  # the system prompt reads best unwrapped

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running (season-scale) tests, excluded from the default CI job"]
addopts = "-q"
